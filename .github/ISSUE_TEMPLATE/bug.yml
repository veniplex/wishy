name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security issues here; report them privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wishy version
      description: Shown in Admin › Updates or at /healthz
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Deployment
      options: [Docker Compose, Docker (other), npm start, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Please remove secrets and personal data
      render: shell
