name: 💡 Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and found no similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the situation or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How could it work or look? Sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I could help implement this.
